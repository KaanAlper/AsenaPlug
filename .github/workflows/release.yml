name: Release Windows EXE

# Actions > "Release Windows EXE" > Run workflow. Sürüm, son Windows sürümünden (vX.Y.Z etiketi) bu yana
# gelen commit'lerden hesaplanır (semantic versioning, Logical Lunge ile aynı kural): "feat:" -> MINOR,
# "fix:" / "perf:" / diğerleri -> PATCH, tipten sonra "!" ya da bir breaking-change footer'ı -> MAJOR.
# "bump" ile seviye elle seçilir. Daha önce kullanılmış bir etiket (başarısız denemeler dahil) asla yeniden
# kullanılmaz; android-v* ve usque-latest etiketleri sayılmaz.
# Exe PyInstaller ile build edilir (windows/build.ps1), release 'latest' olur: çalışan uygulamalar
# /releases/latest'i görüp kendini günceller, install.ps1 de buradan kurar.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version step: auto reads the commits (feat: minor, fix: patch, '!' after the type or a breaking-change footer: major)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
        required: true
      notes:
        description: "Release notes (optional)"
        type: string
        default: ""

permissions:
  contents: write              # release + tag oluşturmak için

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    # İmzalama secret'ı (Repo Settings > Secrets). Tanımlı DEĞİLSE imza adımı
    # atlanır, build yine imzasız çıkar (SmartScreen uyarısı sürer ama release olur).
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sonraki sürümü hesapla
        id: ver
        shell: pwsh
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          $tags = @(git tag --list 'v*')
          $last = $tags | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
            Sort-Object { [version]($_ -replace '^v', '') } -Descending | Select-Object -First 1
          $commits = @()
          if ($last) { $commits = @((git log "$last..HEAD" --format='%s%n%b%x1e') -join "`n" -split [char]0x1e) }
          $v = & ./tools/release-version.ps1 -BaseVersion '1.0.0' -Tags $tags -Commits $commits -Bump $env:BUMP
          Write-Host "Son sürüm: $last, adım: $env:BUMP -> $v"
          $p = "windows/asenaplug/paths.py"
          $src = Get-Content $p -Raw
          $new = $src -replace 'APP_VERSION = "[^"]*"', "APP_VERSION = `"$v`""
          if ($new -eq $src -and $src -notmatch "APP_VERSION = `"$([regex]::Escape($v))`"") { throw 'APP_VERSION satırı bulunamadı' }
          [IO.File]::WriteAllText((Resolve-Path $p), $new, (New-Object Text.UTF8Encoding $false))
          "version=$v" >> $env:GITHUB_OUTPUT
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Kill-switch helper (Go/WFP) build.ps1 içinde derlenir; Go'yu go.mod'a göre kur
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/killswitch/go.mod

      - name: EXE build (PyInstaller / build.ps1)
        shell: pwsh
        run: |
          cd windows
          .\build.ps1

      # Code signing (SignPath.io Foundation — açık kaynağa ÜCRETSİZ) — SADECE
      # SIGNPATH_API_TOKEN secret'ı tanımlıysa çalışır. SignPath, artifact'i GitHub'dan
      # çeker, imzalar, imzalıyı geri indirir. Önce unsigned exe'yi artifact yaparız.
      # Gerekli: SIGNPATH_API_TOKEN (secret) + SignPath panelinden org-id/project-slug/
      # policy-slug (vars). NOT: önce signpath.org/open-source'tan projeyi ONAYLATMAK +
      # panelde "trusted build system=GitHub" + artifact config gerekir.
      - name: Unsigned exe'yi artifact yap (SignPath çeksin)
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: asenaplug-unsigned
          path: windows/dist/AsenaPlug.exe

      - name: Code signing (SignPath.io)
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: windows/dist   # imzalı AsenaPlug.exe geri buraya iner

      # SHA256 İMZADAN SONRA üretilir: imza exe'yi değiştirir, hash imzalı dosyayı kapsamalı.
      - name: SHA256 üret (indirme sonrası bütünlük doğrulaması için)
        shell: pwsh
        run: |
          cd windows/dist
          $h = (Get-FileHash AsenaPlug.exe -Algorithm SHA256).Hash.ToLower()
          "$h  AsenaPlug.exe" | Set-Content AsenaPlug.exe.sha256 -NoNewline -Encoding ascii
          Write-Host "SHA256: $h"

      - name: Pencereli kurulum uygulaması (x64 / x86)
        shell: pwsh
        run: ./installer/gui/build.ps1 -Out windows/dist

      - name: Release oluştur + exe yükle
        uses: softprops/action-gh-release@v2
        with:
          # tag 'vX.Y.Z' biçimi DEĞİŞMEZ: Windows updater /releases/latest tag_name'i buna göre
          # parse ediyor. Görünen adda "Windows" -> Android release'leriyle karışmaz.
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ steps.ver.outputs.sha }}
          name: AsenaPlug Windows v${{ steps.ver.outputs.version }}
          body: ${{ inputs.notes }}
          files: |
            windows/dist/AsenaPlug.exe
            windows/dist/AsenaPlug.exe.sha256
            windows/dist/AsenaPlug-Setup-x64.exe
            windows/dist/AsenaPlug-Setup-x64.exe.sha256
            windows/dist/AsenaPlug-Setup-x86.exe
            windows/dist/AsenaPlug-Setup-x86.exe.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          make_latest: "true"
